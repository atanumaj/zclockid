# /etc/nginx/sites-available/zclockid.conf
# ZclockID Appliance Unified Ingress Proxy (Port 443 Multiplexing)

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Redirect all plain HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2 default_server;
    client_max_body_size 500M;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    # Appliance TLS Certificates
    ssl_certificate /etc/zclockid/certs/appliance.crt;
    ssl_certificate_key /etc/zclockid/certs/appliance.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # 1. HTML5 Web Dashboard (Static Single Page App)
    root /opt/zclockid/web;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Dynamic Custom Portal HTML Overrides & Uploaded Brand Assets (pfSense-style)
    location = /register.html {
        proxy_pass http://127.0.0.1:8000/register.html;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /password-reset.html {
        proxy_pass http://127.0.0.1:8000/password-reset.html;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /portal-assets/ {
        proxy_pass http://127.0.0.1:8000/portal-assets/;
        proxy_set_header Host $host;
    }

    # 2. Headless REST Management API
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8000/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Swagger / OpenAPI Documentation
    location ~ ^/(docs|redoc|openapi.json) {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    # 3. DNS-over-HTTPS (DoH) Endpoint (RFC 8484)
    location /dns-query {
        grpc_pass grpc://127.0.0.1:8053;
        grpc_set_header Host $host;
        grpc_set_header X-Real-IP $remote_addr;
    }

    # 4. Keycloak SAML 2.0 / OIDC Identity Provider
    location /auth/ {
        proxy_pass http://127.0.0.1:8080/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}

