# /etc/samba/smb.conf
# ZclockID Appliance - Production Active Directory Domain Controller Configuration

[global]
    netbios name = DC1
    realm = CORP.EXAMPLE.COM
    workgroup = CORP
    server role = active directory domain controller
    ad dc functional level = 2016

    # DNS Backend (Delegated dynamically to BIND9 DLZ)
    server services = -dns
    dns forwarder = 1.1.1.1 8.8.8.8

    # Kerberos, Security & NT-Hash Authentication
    kerberos method = secrets and keytab
    ntlm auth = mschapv2-and-ntlmv2-only
    client ldap sasl wrapping = sign
    ldap server require strong auth = yes

    # Winbind & RFC2307 POSIX Attributes
    idmap_ldb:use rfc2307 = yes
    winbind enum users = yes
    winbind enum groups = yes
    winbind use default domain = yes

    # Modern Protocol Minimums (Disable SMB1)
    server min protocol = SMB2_10
    client min protocol = SMB2_10

    # Enterprise Logging & Audit
    log level = 1 auth_audit:3
    log file = /var/log/samba/%m.log
    max log size = 50000

    # Windows Time Service Signed Socket (Chrony)
    ntp signd socket directory = /var/lib/samba/ntp_signd

[sysvol]
    path = /var/lib/samba/sysvol
    read only = no

[netlogon]
    path = /var/lib/samba/sysvol/corp.example.com/scripts
    read only = no

