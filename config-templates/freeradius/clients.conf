# /etc/freeradius/3.0/clients.conf
# ZclockID FreeRADIUS Network Access Server (NAS) Clients

# Localhost test client
client localhost {
    ipaddr = 127.0.0.1
    proto = *
    secret = testing123
    require_message_authenticator = no
    nas_type = other
}

# Enterprise Access Point Cluster / Switches
client corporate_network_switches {
    ipaddr = 192.168.1.0/24
    secret = RadSecureP@ssw0rd2026!
    shortname = corp-infra
    nas_type = other
    limit {
        max_connections = 100
        lifetime = 3600
        idle_timeout = 30
    }
}

