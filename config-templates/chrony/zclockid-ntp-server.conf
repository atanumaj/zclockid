# ZclockID Active Directory Authoritative NTP Server Configuration
# Enables MS-SNTP signed time synchronization for Windows AD clients
ntpsigndsocket /var/lib/samba/ntp_signd

# Allow NTP clients from local networks to query this DC
allow 0.0.0.0/0
allow ::/0

# Serve time even if disconnected from upstream internet (fallback stratum 10)
local stratum 10 orphan
