name: Build Debian Package

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set package version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="1.0.0"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt -r requirements-dev.txt

      - name: Verify Tailwind CSS build
        run: |
          TAILWIND_CLI_VER="v3.4.17"
          TAILWIND_BIN="/tmp/tailwindcss-linux-x64"
          EXPECTED_SHA256="7d24f7fa191d2193b78cd5f5a42a6093e14409521908529f42d80b11fde1f1d4"
          curl -sL "https://github.com/tailwindlabs/tailwindcss/releases/download/${TAILWIND_CLI_VER}/tailwindcss-linux-x64" -o "${TAILWIND_BIN}"
          chmod +x "${TAILWIND_BIN}"
          ACTUAL_SHA256="$(sha256sum "${TAILWIND_BIN}" | awk '{print $1}')"
          if [[ "${ACTUAL_SHA256}" != "${EXPECTED_SHA256}" ]]; then
            echo "ERROR: Tailwind standalone CLI SHA-256 verification failed!" >&2
            exit 1
          fi
          "${TAILWIND_BIN}" -c tailwind.config.js -i web/css/tailwind-input.css -o web/css/tailwind.css --minify
          git diff --exit-code web/css/tailwind.css

      - name: Run Security and XSS Scans
        run: |
          chmod +x tests/xss_scan.sh
          ./tests/xss_scan.sh

      - name: Run Pip Audit Vulnerability Scan
        # Note: Appliance production runtime uses pre-packaged Ubuntu python3-* packages (e.g. python3-fastapi, python3-requests).
        # We audit api/requirements.txt to prevent supply-chain vulnerabilities in bundled dependencies.
        run: |
          pip-audit -r api/requirements.txt

      - name: Run Gitleaks Secrets Scan
        run: |
          GITLEAKS_VER="v8.21.2"
          GITLEAKS_BIN="/tmp/gitleaks"
          EXPECTED_GITLEAKS_SHA256="5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VER}/gitleaks_${GITLEAKS_VER#v}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          ACTUAL_GITLEAKS_SHA256="$(sha256sum /tmp/gitleaks.tar.gz | awk '{print $1}')"
          if [[ "${ACTUAL_GITLEAKS_SHA256}" != "${EXPECTED_GITLEAKS_SHA256}" ]]; then
            echo "ERROR: Gitleaks release tarball SHA-256 verification failed! Expected ${EXPECTED_GITLEAKS_SHA256}, got ${ACTUAL_GITLEAKS_SHA256}" >&2
            exit 1
          fi
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          chmod +x "${GITLEAKS_BIN}"
          "${GITLEAKS_BIN}" detect --source . --config .gitleaks.toml --redact --verbose

      - name: Verify No ZCLOCK_PASS Defaults
        run: |
          if grep -rnE 'os\.(environ\.get|getenv)\(["'\''"]ZCLOCK_PASS["'\''"],\s*[^)]+\)' tests/ scripts/ api/ .github/; then
            echo "ERROR: Fallback default password found for ZCLOCK_PASS!" >&2
            exit 1
          fi

      - name: Run Full Test Suite
        run: |
          PYTHONPATH=. pytest tests -q

      - name: Build thin deb package
        run: |
          chmod +x package/build-deb.sh
          ./package/build-deb.sh "${{ steps.version.outputs.VERSION }}"

      - name: Upload Debian Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zclockid-deb
          path: zclockid_*.deb
          if-no-files-found: error

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: zclockid_*.deb
          generate_release_notes: true

