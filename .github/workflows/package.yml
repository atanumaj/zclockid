name: Build Debian Package

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set package version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="1.0.0"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt

      - name: Verify Tailwind CSS build
        run: |
          TAILWIND_CLI_VER="v3.4.17"
          TAILWIND_BIN="/tmp/tailwindcss-linux-x64"
          EXPECTED_SHA256="7d24f7fa191d2193b78cd5f5a42a6093e14409521908529f42d80b11fde1f1d4"
          curl -sL "https://github.com/tailwindlabs/tailwindcss/releases/download/${TAILWIND_CLI_VER}/tailwindcss-linux-x64" -o "${TAILWIND_BIN}"
          chmod +x "${TAILWIND_BIN}"
          ACTUAL_SHA256="$(sha256sum "${TAILWIND_BIN}" | awk '{print $1}')"
          if [[ "${ACTUAL_SHA256}" != "${EXPECTED_SHA256}" ]]; then
            echo "ERROR: Tailwind standalone CLI SHA-256 verification failed!" >&2
            exit 1
          fi
          "${TAILWIND_BIN}" -c tailwind.config.js -i web/css/tailwind-input.css -o web/css/tailwind.css --minify
          git diff --exit-code web/css/tailwind.css

      - name: Run Security and XSS Scans
        run: |
          chmod +x tests/xss_scan.sh
          ./tests/xss_scan.sh

      - name: Verify No Live Credentials Committed
        run: |
          if grep -rn --exclude="*.pyc" --exclude-dir="__pycache__" -F "P@ssw0rd@inet" tests/ scripts/ ; then
            echo "ERROR: Live credential 'P@ssw0rd@inet' detected in tests/ or scripts/!" >&2
            exit 1
          fi

      - name: Run Authentication Coverage Tests
        run: |
          PYTHONPATH=. pytest tests/test_auth_coverage.py -v

      - name: Build thin deb package
        run: |
          chmod +x package/build-deb.sh
          ./package/build-deb.sh "${{ steps.version.outputs.VERSION }}"

      - name: Upload Debian Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zclockid-deb
          path: zclockid_*.deb
          if-no-files-found: error

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: zclockid_*.deb
          generate_release_notes: true

